<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoutineTrack">
<title>RoutineTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">RT</span>
      <div class="brand-text">
        <div class="brand-name">RoutineTrack</div>
        <div class="brand-sub" id="todayLabel">—</div>
      </div>
    </div>
    <button class="icon-btn" id="dateBtn" title="Jump to another date" aria-label="Jump to date">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="main" id="main">
    <!-- views are rendered by JS -->
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="today" aria-label="Today">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="history" aria-label="History">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16M6 5v14M18 5v14M4 12h16" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2.7-1.6L13.4 2h-3L10 4.9a7 7 0 0 0-2.7 1.6l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 3.2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2.7 1.6l.4 2.9h3l.4-2.9a7 7 0 0 0 2.7-1.6l2.4 1 2-3.5-2-1.5A7 7 0 0 0 19 12z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<!-- Modal root -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
